name: Pages

# Builds Storybook, assembles the docs site, and publishes it to GitHub Pages on
# every push to main. The build runs `codegen` first, which downloads the live
# sobek schema and regenerates the TypeScript types the components are built
# against.
#
# Published layout:
#   /             landing page      (docs/pages/index.html)
#   /guide.html   host guide        (docs/using-entity-forms-host-guide.html)
#   /storybook/   Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen # downloads schema + regenerates types
      - run: npm run build-storybook

      - name: Assemble site
        run: |
          mkdir -p _site/storybook
          cp -r storybook-static/. _site/storybook/
          cp docs/pages/index.html _site/index.html
          cp docs/using-entity-forms-host-guide.html _site/guide.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
